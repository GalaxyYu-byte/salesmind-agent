[project]
name = "salesmind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yuqishun", email = "keng0901956007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncmy>=0.2.15",
    "fastapi>=0.141.1",
    "httpx>=0.28.1,<1",
    "langgraph>=1,<2",
    "pillow>=11,<13",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10,<3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
salesmind = "salesmind:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis[lua]>=2.32,<3",
    "httpx>=0.28.1",
    "paramiko>=5.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
